name: SPHINX

on:
  push:
  pull_request:

jobs:
  sphinx_html:
    runs-on: ubuntu-latest
    container:
      image: ghdl/ghdl:5.0.0-dev-gcc-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup and Run Sphinx transformation
        run: |
          apt update && apt install -y ant python3 python3-pip
          pip3 install --break-system-packages click jinja2 Sphinx pygments-plugin-simstm

      - name: Generate HTML documentation
        run: ant sphinx-rst2html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghdl-test-results
          path: docs/html/
