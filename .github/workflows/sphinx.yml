name: SPHINX

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  sphinx_html:
    runs-on: ubuntu-latest
    container:
      image: ghdl/ghdl:5.0.0-dev-gcc-ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup and Run Sphinx transformation
        run: |
          apt update && apt install -y ant python3 python3-pip git
          pip3 install --break-system-packages click jinja2 Sphinx pygments-plugin-simstm

      - name: Generate HTML documentation
        run: ant sphinx-rst2html

      - name: Commit generated HTML documentation
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.actor != 'github-actions[bot]'
        working-directory: ${{ github.workspace }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/html
          if git diff --cached --quiet; then
            echo "No generated documentation changes to commit."
            exit 0
          fi
          git commit -m "Update generated HTML docs [skip ci]"
          git push origin HEAD:${GITHUB_REF#refs/heads/}

